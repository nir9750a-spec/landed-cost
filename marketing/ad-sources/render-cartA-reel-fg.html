.stamp{position:absolute;top:70px;left:60px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,0.92);
 border:4px solid #e0863a;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;

.price .num{font-size:82px;font-weight:bold;line-height:1;}
.price .vat{font-size:30px;font-weight:bold;margin-top:6px;}
.footer{position:absolute;bottom:0;left:0;width:1080px;height:110px;background:rgba(18,20,15,0.94);display:flex;align-items:center;justify-content:center;color:#fff;font-size:33px;font-weight:bold;}
