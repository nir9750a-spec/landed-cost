<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:transparent;}*{box-sizing:border-box;-webkit-font-smoothing:antialiased;}
.page{position:relative;width:1080px;height:1920px;overflow:hidden;background:transparent;font-family:"FreeSans","DejaVu Sans",sans-serif;}
.scrimTop{position:absolute;top:0;left:0;width:1080px;height:760px;background:linear-gradient(180deg,rgba(8,10,6,0.82)0%,rgba(8,10,6,0.32)55%,rgba(0,0,0,0)100%);}
.scrimBot{position:absolute;bottom:0;left:0;width:1080px;height:620px;background:linear-gradient(0deg,rgba(8,10,6,0.90)0%,rgba(8,10,6,0.30)55%,rgba(0,0,0,0)100%);}
.logo{position:absolute;top:64px;right:56px;background:#12140f;border-radius:22px;padding:16px 28px;display:flex;align-items:center;box-shadow:0 6px 22px rgba(0,0,0,0.5);}
.logo img{height:60px;display:block;filter:invert(1) brightness(1.9);}
.headline{position:absolute;top:210px;right:64px;left:130px;text-align:right;color:#fff;font-weight:bold;font-size:100px;line-height:1.04;letter-spacing:-1px;text-shadow:0 3px 18px rgba(0,0,0,0.7);}
.headline .hl{color:#f0a45a;}
.sub{position:absolute;top:400px;right:64px;left:130px;text-align:right;color:#f3efe6;font-size:36px;font-weight:bold;line-height:1.4;text-shadow:0 2px 12px rgba(0,0,0,0.9);}
.price{position:absolute;bottom:250px;right:64px;background:#e0863a;color:#fff;border-radius:30px;padding:20px 44px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,0.5);}
.price .num{font-size:80px;font-weight:bold;line-height:1;}
.price .vat{font-size:30px;font-weight:bold;margin-top:6px;}
.footer{position:absolute;bottom:0;left:0;width:1080px;height:110px;background:rgba(18,20,15,0.94);display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px;font-weight:bold;}
</style></head><body>
<div class="page">
  <div class="scrimTop"></div><div class="scrimBot"></div>
  <div class="logo"><img src="file:///home/user/landed-cost/marketing/ad-sources/4elements-logo.png"></div>

</div></body></html>
