<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:transparent;}*{box-sizing:border-box;-webkit-font-smoothing:antialiased;}
.page{position:relative;width:1080px;height:1920px;overflow:hidden;background:transparent;font-family:"FreeSans","DejaVu Sans",sans-serif;}
.scrimTop{position:absolute;top:0;left:0;width:1080px;height:320px;background:linear-gradient(180deg,rgba(20,25,15,0.42)0%,rgba(20,25,15,0)100%);}
.scrimBot{position:absolute;bottom:0;left:0;width:1080px;height:640px;background:linear-gradient(0deg,rgba(15,20,12,0.92)0%,rgba(15,20,12,0.55)45%,rgba(0,0,0,0)100%);}
.logo{position:absolute;top:50px;right:50px;background:#12140f;border-radius:20px;padding:14px 24px;display:flex;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,0.45);}
.logo img{height:52px;display:block;filter:invert(1) brightness(1.9);}
.stamp{position:absolute;top:54px;left:54px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,0.95);
 border:4px solid #e0863a;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
 color:#c26a22;font-weight:bold;box-shadow:0 8px 22px rgba(0,0,0,0.4);transform:rotate(-11deg);}
.stamp .a{font-size:36px;line-height:1;}.stamp .b{font-size:36px;line-height:1;margin-top:3px;}.stamp .c{font-size:23px;margin-top:6px;color:#333;}
/* bottom stacked block — no overlap */
.headline{position:absolute;bottom:360px;right:56px;left:56px;text-align:right;color:#fff;font-weight:bold;font-size:76px;line-height:1.08;letter-spacing:-1px;text-shadow:0 3px 16px rgba(0,0,0,0.75);}
.sub{position:absolute;bottom:300px;right:56px;left:56px;text-align:right;color:#f2eee4;font-size:33px;font-weight:bold;text-shadow:0 2px 10px rgba(0,0,0,0.9);}
.price{position:absolute;bottom:130px;right:56px;background:#e0863a;color:#fff;border-radius:26px;padding:16px 38px;text-align:center;box-shadow:0 8px 26px rgba(0,0,0,0.5);}
.price .num{font-size:72px;font-weight:bold;line-height:1;}.price .vat{font-size:26px;font-weight:bold;margin-top:4px;}
.buy{position:absolute;bottom:150px;left:56px;text-align:left;color:#fff;}
.buy .k{font-size:30px;font-weight:bold;opacity:.9}
.buy .v{font-size:40px;font-weight:bold;line-height:1.1;text-shadow:0 2px 10px rgba(0,0,0,0.8);direction:ltr;text-align:left;}
.buy .p{font-size:30px;font-weight:bold;line-height:1.2;margin-top:4px;color:#f2c98a;direction:ltr;text-align:left;text-shadow:0 2px 10px rgba(0,0,0,0.85)}
</style></head><body>
<div class="page">
  <div class="scrimTop"></div><div class="scrimBot"></div>
  <div class="logo"><img src="file:///home/user/landed-cost/marketing/ad-sources/4elements-logo.png"></div>
  <div class="stamp"><div class="a">משלוח</div><div class="b">חינם</div><div class="c">מעל ₪350</div></div>
  <div class="headline">עגלת חוף/קמפינג מתקפלת</div>
  <div class="sub">נפתחת ומתקפלת בשניות · גלגלים רחבים לחול</div>
  <div class="buy"><div class="k">לרכישה באתר</div><div class="v">4elements.co.il</div><div class="p">☎ 052-891-3135</div></div>
  <div class="price"><div class="num">₪279</div><div class="vat">כולל מע״מ</div></div>
</div></body></html>
