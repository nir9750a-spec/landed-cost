<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:transparent;}*{box-sizing:border-box;-webkit-font-smoothing:antialiased;}
.page{position:relative;width:1080px;height:1920px;overflow:hidden;background:transparent;font-family:"FreeSans","DejaVu Sans",sans-serif;}
.scrimTop{position:absolute;top:0;left:0;width:1080px;height:340px;background:linear-gradient(180deg,rgba(20,25,15,0.45)0%,rgba(20,25,15,0)100%);}
.scrimBot{position:absolute;bottom:0;left:0;width:1080px;height:520px;background:linear-gradient(0deg,rgba(20,25,15,0.86)0%,rgba(20,25,15,0.30)55%,rgba(0,0,0,0)100%);}
.logo{position:absolute;top:52px;right:52px;background:#12140f;border-radius:20px;padding:14px 24px;display:flex;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,0.4);}
.logo img{height:54px;display:block;filter:invert(1) brightness(1.9);}
.stamp{position:absolute;top:56px;left:56px;width:184px;height:184px;border-radius:50%;background:rgba(255,255,255,0.94);
 border:4px solid #e0863a;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
 color:#c26a22;font-weight:bold;box-shadow:0 8px 22px rgba(0,0,0,0.35);transform:rotate(-11deg);}
.stamp .a{font-size:37px;line-height:1;}.stamp .b{font-size:37px;line-height:1;margin-top:3px;}.stamp .c{font-size:24px;margin-top:7px;color:#333;}
.price{position:absolute;bottom:180px;right:56px;background:#e0863a;color:#fff;border-radius:28px;padding:18px 40px;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,0.5);}
.price .num{font-size:78px;font-weight:bold;line-height:1;}.price .vat{font-size:28px;font-weight:bold;margin-top:5px;}
.cta{position:absolute;bottom:210px;left:56px;right:340px;text-align:right;color:#fff;font-weight:bold;}
.cta .big{font-size:44px;line-height:1.1;text-shadow:0 2px 12px rgba(0,0,0,0.7);}
.footer{position:absolute;bottom:0;left:0;width:1080px;height:104px;background:rgba(18,20,15,0.94);display:flex;align-items:center;justify-content:center;color:#fff;font-size:33px;font-weight:bold;}
</style></head><body>
<div class="page">
  <div class="scrimTop"></div><div class="scrimBot"></div>
  <div class="logo"><img src="file:///home/user/landed-cost/marketing/ad-sources/4elements-logo.png"></div>
  <div class="stamp"><div class="a">משלוח</div><div class="b">חינם</div><div class="c">מעל ₪350</div></div>
  <div class="cta"><div class="big">עגלת חוף/קמפינג<br>מתקפלת</div></div>
  <div class="price"><div class="num">₪279</div><div class="vat">כולל מע״מ</div></div>
  <div class="footer">לרכישה: www.4elements.co.il · 052-891-3135</div>
</div></body></html>
