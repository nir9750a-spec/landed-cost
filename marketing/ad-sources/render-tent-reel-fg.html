<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:transparent;}*{box-sizing:border-box;-webkit-font-smoothing:antialiased;}
.page{position:relative;width:1080px;height:1920px;overflow:hidden;background:transparent;font-family:"FreeSans","DejaVu Sans",sans-serif;}
.scrimTop{position:absolute;top:0;left:0;width:1080px;height:360px;background:linear-gradient(180deg,rgba(20,30,20,0.55)0%,rgba(20,30,20,0)100%);}
.scrimBot{position:absolute;bottom:0;left:0;width:1080px;height:640px;background:linear-gradient(0deg,rgba(20,32,18,0.92)0%,rgba(20,32,18,0.35)55%,rgba(0,0,0,0)100%);}
.logo{position:absolute;top:60px;right:56px;background:#12140f;border-radius:22px;padding:16px 28px;display:flex;align-items:center;box-shadow:0 6px 22px rgba(0,0,0,0.45);}
.logo img{height:60px;display:block;filter:invert(1) brightness(1.9);}
.headline{position:absolute;bottom:410px;right:64px;left:120px;text-align:right;color:#fff;font-weight:bold;font-size:96px;line-height:1.05;letter-spacing:-1px;text-shadow:0 3px 18px rgba(0,0,0,0.7);}
.headline .hl{color:#ffd27a;}
.sub{position:absolute;bottom:320px;right:64px;left:120px;text-align:right;color:#f3efe6;font-size:38px;font-weight:bold;text-shadow:0 2px 12px rgba(0,0,0,0.9);}
.price{position:absolute;bottom:150px;right:64px;background:#e0863a;color:#fff;border-radius:30px;padding:20px 44px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,0.5);}
.price .num{font-size:80px;font-weight:bold;line-height:1;}
.price .vat{font-size:30px;font-weight:bold;margin-top:6px;}
.footer{position:absolute;bottom:0;left:0;width:1080px;height:110px;background:rgba(18,26,15,0.94);display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px;font-weight:bold;}
</style></head><body>
<div class="page">
  <div class="scrimTop"></div><div class="scrimBot"></div>
  <div class="logo"><img src="file:///home/user/landed-cost/marketing/ad-sources/4elements-logo.png"></div>
  <div class="headline">בית שנפתח<br><span class="hl">בנשימה אחת.</span></div>

  <div class="footer">www.4elements.co.il · 052-891-3135</div>
</div></body></html>
