<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;}
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  .page{position:relative;width:1080px;height:1350px;overflow:hidden;background:#12140f;font-family:"FreeSans","DejaVu Sans",sans-serif;}
  .bg{position:absolute;inset:0;width:1080px;height:1350px;object-fit:cover;object-position:center 36%;}
  .scrimTop{position:absolute;top:0;left:0;width:1080px;height:560px;background:linear-gradient(180deg,rgba(12,15,10,0.82)0%,rgba(12,15,10,0.35)55%,rgba(0,0,0,0)100%);}
  .scrimBot{position:absolute;bottom:0;left:0;width:1080px;height:300px;background:linear-gradient(0deg,rgba(12,15,10,0.85)0%,rgba(0,0,0,0)100%);}
  .logo{position:absolute;top:40px;right:46px;background:#12140f;border-radius:20px;padding:15px 24px;display:flex;align-items:center;box-shadow:0 6px 22px rgba(0,0,0,0.4);}
  .logo img{height:56px;display:block;filter:invert(1) brightness(1.9);}
  .headline{position:absolute;top:172px;right:56px;left:120px;text-align:right;color:#fff;font-weight:bold;font-size:90px;line-height:1.05;letter-spacing:-1px;text-shadow:0 3px 16px rgba(0,0,0,0.55);}
  .headline .hl{color:#f0a45a;}
  .sub{position:absolute;top:392px;right:56px;left:120px;text-align:right;color:#f3efe6;font-size:32px;font-weight:bold;text-shadow:0 2px 10px rgba(0,0,0,0.7);}
  .price{position:absolute;bottom:150px;right:56px;background:#e0863a;color:#fff;border-radius:26px;padding:16px 36px;text-align:center;box-shadow:0 8px 26px rgba(0,0,0,0.45);}
  .price .num{font-size:66px;font-weight:bold;line-height:1;}
  .price .vat{font-size:26px;font-weight:bold;margin-top:4px;}
  .footer{position:absolute;bottom:0;left:0;width:1080px;height:92px;background:rgba(18,20,15,0.92);display:flex;align-items:center;justify-content:center;color:#fff;font-size:29px;font-weight:bold;}
</style></head><body>
<div class="page">
  <img class="bg" src="file:///home/user/landed-cost/marketing/ad-sources/cart-real-loaded.jpg">
  <div class="scrimTop"></div><div class="scrimBot"></div>
  <div class="logo"><img src="file:///home/user/landed-cost/marketing/ad-sources/4elements-logo.png"></div>
  <div class="headline">לא רק לקמפינג.<br><span class="hl">לכל יום.</span></div>
  <div class="sub">עגלת קמפינג מתקפלת · 150 ליטר · עד 150 ק״ג · מהסופר ועד החוף</div>
  <div class="price"><div class="num">₪279</div><div class="vat">כולל מע״מ</div></div>
  <div class="footer">www.4elements.co.il · 052-891-3135</div>
</div>
</body></html>
