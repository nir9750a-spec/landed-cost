<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;}*{box-sizing:border-box;-webkit-font-smoothing:antialiased;}
.page{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:"FreeSans","DejaVu Sans",sans-serif;
 background:radial-gradient(120% 80% at 50% 25%, #f0efed 0%, #e6e4e1 45%, #d3d0cb 100%);}
.logo{position:absolute;top:40px;left:44px;background:#12140f;border-radius:18px;padding:12px 22px;display:flex;align-items:center;box-shadow:0 5px 16px rgba(0,0,0,0.28);}
.logo img{height:46px;display:block;filter:invert(1) brightness(1.9);}
.namecol{position:absolute;top:44px;right:48px;text-align:right;}
.namecol .nm{color:#3a3a3a;font-size:34px;font-weight:bold;line-height:1.15;}
.namecol .price{color:#e11d1d;font-weight:bold;font-size:118px;line-height:0.9;margin-top:6px;letter-spacing:-2px;}
.namecol .price small{font-size:46px;}
.namecol .vat{color:#6a6a6a;font-size:28px;font-weight:bold;margin-top:2px;}
.stamp{position:absolute;top:250px;left:56px;width:180px;height:180px;border-radius:50%;background:#fff;
 border:4px solid #e11d1d;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
 color:#e11d1d;font-weight:bold;box-shadow:0 8px 20px rgba(0,0,0,0.22);transform:rotate(-11deg);}
.stamp .a{font-size:36px;line-height:1;}.stamp .b{font-size:36px;line-height:1;margin-top:3px;}
.stamp .c{font-size:24px;line-height:1;margin-top:7px;color:#333;font-weight:bold;}
.cart{position:absolute;left:50%;top:400px;transform:translateX(-50%);width:620px;
 filter:drop-shadow(0 18px 24px rgba(40,35,30,0.28));}
.spec{position:absolute;bottom:305px;left:0;width:1080px;text-align:center;color:#4a4640;font-size:30px;font-weight:bold;}
.tag{position:absolute;bottom:236px;left:0;width:1080px;text-align:center;color:#2a2a2a;font-size:42px;font-weight:bold;}
.btn{position:absolute;bottom:78px;left:90px;width:900px;height:108px;background:#e11d1d;border-radius:20px;
 display:flex;align-items:center;justify-content:center;color:#fff;font-size:48px;font-weight:bold;box-shadow:0 10px 26px rgba(200,20,20,0.4);}
.site{position:absolute;bottom:26px;left:0;width:1080px;text-align:center;color:#555;font-size:26px;font-weight:bold;}
</style></head><body>
<div class="page">
  <div class="logo"><img src="file:///home/user/landed-cost/marketing/ad-sources/4elements-logo.png"></div>
  <div class="namecol">
    <div class="nm">עגלת חוף/קמפינג<br>מתקפלת</div>
    <div class="price">₪279<small></small></div>
    <div class="vat">כולל מע״מ</div>
  </div>
  <div class="stamp"><div class="a">משלוח</div><div class="b">חינם</div><div class="c">מעל ₪350</div></div>
  <img class="cart" src="file:///home/user/landed-cost/marketing/ad-sources/cart-cutout.png">
  <div class="spec">85×50×50 ס״מ · ידית 75–100 ס״מ · גלגלים רחבים לחול</div>
  <div class="tag">בואו נצא לטבע בסטייל 🛒</div>
  <div class="btn">לקנייה »</div>
  <div class="site">www.4elements.co.il · 052-891-3135</div>
</div></body></html>
