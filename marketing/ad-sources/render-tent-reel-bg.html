<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;}*{box-sizing:border-box;}
.page{position:relative;width:1080px;height:1920px;overflow:hidden;
 background:
  radial-gradient(120% 70% at 50% 18%, #cfe3ec 0%, #bcd6df 30%, #a9c6b6 55%, #86a77e 78%, #5f7d57 100%);}
.sun{position:absolute;top:120px;left:50%;transform:translateX(-50%);width:520px;height:520px;border-radius:50%;
 background:radial-gradient(circle, rgba(255,246,214,0.85) 0%, rgba(255,240,200,0.25) 45%, rgba(255,240,200,0) 70%);}
.ground{position:absolute;bottom:0;left:0;width:1080px;height:560px;
 background:linear-gradient(0deg,#4f6b48 0%,#6a8a5e 45%,rgba(120,150,110,0) 100%);}
.shadow{position:absolute;left:50%;top:1170px;transform:translateX(-50%);width:760px;height:130px;border-radius:50%;
 background:radial-gradient(ellipse, rgba(30,40,25,0.38) 0%, rgba(30,40,25,0) 70%);filter:blur(6px);}
.tent{position:absolute;left:50%;top:360px;transform:translateX(-50%);width:940px;height:940px;
 object-fit:contain;filter:drop-shadow(0 20px 30px rgba(20,30,15,0.25));}
</style></head><body>
<div class="page">
  <div class="sun"></div>
  <div class="ground"></div>
  <div class="shadow"></div>
  <img class="tent" src="file:///home/user/landed-cost/marketing/ad-sources/tent-cutout.png">
</div></body></html>
