<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;}*{box-sizing:border-box;}
.page{position:relative;width:1080px;height:1920px;overflow:hidden;
 background:radial-gradient(130% 70% at 50% 20%, #dff1f6 0%, #cfe7ec 28%, #f3e4c4 55%, #e8cf9e 78%, #d9b877 100%);}
.sun{position:absolute;top:130px;left:50%;transform:translateX(-50%);width:600px;height:600px;border-radius:50%;
 background:radial-gradient(circle, rgba(255,248,224,0.9) 0%, rgba(255,240,205,0.28) 45%, rgba(255,240,205,0) 70%);}
.sand{position:absolute;bottom:0;left:0;width:1080px;height:520px;
 background:linear-gradient(0deg,#d8bd82 0%,#e6d0a0 45%,rgba(230,208,160,0) 100%);}
.shadow{position:absolute;left:50%;top:1140px;transform:translateX(-50%);width:820px;height:130px;border-radius:50%;
 background:radial-gradient(ellipse, rgba(90,70,35,0.34) 0%, rgba(90,70,35,0) 70%);filter:blur(7px);}
.cart{position:absolute;left:50%;top:520px;transform:translateX(-50%);height:600px;width:auto;
 filter:drop-shadow(0 22px 30px rgba(60,45,20,0.30));}
</style></head><body>
<div class="page">
  <div class="sun"></div><div class="sand"></div><div class="shadow"></div>
  <img class="cart" src="file:///home/user/landed-cost/marketing/ad-sources/cart-new-cutout.png">
</div></body></html>
