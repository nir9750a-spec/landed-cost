# "מה עובד ומה לא" — automatically, on every change and every morning.
#
# This is the development safety net for a system you cannot watch. It runs the same
# ads/selftest.py you run locally: read-only checks against Supabase, Telegram, the product
# profiles, the renderer and the scene bank. It never posts anything.
#
# Push a change to ads/ → this tells you within a minute whether the engine still boots.
name: ads-selftest

on:
  push:
    paths: ['ads/**', '.github/workflows/ads-*.yml']
  pull_request:
    paths: ['ads/**']
  schedule:
    - cron: '30 5 * * *'      # 08:30 Israel — 30 min before the daily run, so a break is
                              # caught (and announced on Telegram) before it costs a day
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install --quiet pillow

      - name: Compile every module
        run: python -m compileall -q ads

      # Secrets first: without them nothing downstream can work, and a missing-key
      # traceback from the dry run buries the one line that actually matters.
      - name: Are the repo secrets configured?
        run: |
          missing=""
          for v in SUPABASE_SERVICE_KEY TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Repo secrets not configured::Missing:$missing"
            echo "The ad engine cannot reach Supabase or Telegram without these."
            echo "Add them under Settings -> Secrets and variables -> Actions:"
            for v in $missing; do echo "  - $v"; done
            echo "Values live in ads/.env on Nir's machine. SUPABASE_SERVICE_KEY must be the"
            echo "legacy service_role key starting with eyJ (sb_secret keys are blocked by RLS)."
            exit 1
          fi
          echo "All three secrets present."

      # Health check before the dry run: it reports every dependency as a readable table
      # instead of dying on the first one.
      # Only the scheduled morning check pings Telegram — a push shouldn't buzz the phone.
      - name: Health check
        working-directory: ads
        run: python selftest.py ${{ github.event_name == 'schedule' && '--notify' || '' }}

      - name: Dry run the whole daily cycle (renders, posts nothing)
        working-directory: ads
        run: python headless_daily.py --dry-run

      - name: Machine-readable report
        if: ${{ always() }}
        working-directory: ads
        run: python selftest.py --json > selftest.json || true

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: selftest-${{ github.run_number }}
          path: ads/selftest.json
          if-no-files-found: ignore
